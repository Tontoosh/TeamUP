services:
  teamup:
    build: .
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DB_DRIVER: sqlite
      SQLITE_PATH: /app/data/teamup.db
      UPLOAD_PATH: /app/data/uploads
      AUTH_BYPASS: "false"
      SEED_DEMO: ${TEAMUP_SEED_DEMO:-true}
      APP_URL: ${TEAMUP_APP_URL:-http://localhost:3001}
      COOKIE_SECURE: "false"
      SMTP_HOST: ${TEAMUP_SMTP_HOST:-}
      SMTP_PORT: ${TEAMUP_SMTP_PORT:-587}
      SMTP_USER: ${TEAMUP_SMTP_USER:-}
      SMTP_PASSWORD: ${TEAMUP_SMTP_PASSWORD:-}
      MAIL_FROM: ${TEAMUP_MAIL_FROM:-TeamUP <noreply@example.com>}
    volumes:
      - teamup-data:/app/data
    restart: unless-stopped
    stop_grace_period: 15s
volumes:
  teamup-data:
